<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CarPart Compatibility Hub{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #f8f9fa;
    }
    .navbar-brand {
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .main-content {
      flex: 1;
    }
    .card {
      border: none;
      box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand text-warning" href="{% url 'catalog:index' %}">
        <i class="bi bi-gear-wide-connected me-2"></i>CarPart Hub
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        {% if user.is_authenticated %}
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" href="{% url 'catalog:part-list' %}">
                <i class="bi bi-cpu me-1"></i>Parts
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'catalog:car-list' %}">
                <i class="bi bi-car-front me-1"></i>Cars
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'catalog:manufacturer-list' %}">
                <i class="bi bi-buildings me-1"></i>Manufacturers
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'catalog:category-list' %}">
                <i class="bi bi-tags me-1"></i>Categories
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'catalog:mechanic-list' %}">
                <i class="bi bi-people me-1"></i>Mechanics
              </a>
            </li>
          </ul>
          <div class="d-flex align-items-center gap-3">
            <a href="{% url 'catalog:mechanic-detail' user.id %}" class="btn btn-outline-light btn-sm">
              <i class="bi bi-person-circle me-1"></i>{{ user.username }}
            </a>
            <form action="{% url 'logout' %}" method="post" class="d-inline m-0">
              {% csrf_token %}
              <button type="submit" class="btn btn-danger btn-sm">
                <i class="bi bi-box-arrow-right me-1"></i>Logout
              </button>
            </form>
          </div>
        {% else %}
          <div class="navbar-nav ms-auto">
            <a class="btn btn-outline-warning btn-sm" href="{% url 'login' %}">
              <i class="bi bi-box-arrow-in-right me-1"></i>Login
            </a>
          </div>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container py-4 main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="bg-dark text-secondary py-3 text-center small mt-auto">
    <div class="container">
      <span>CarPart Compatibility Service &copy; 2026</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
