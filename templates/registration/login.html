{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block title %}Login - CarPart Hub{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm p-4 mt-4">
      <h3 class="text-center mb-4 fw-bold text-dark">
        <i class="bi bi-shield-lock me-2 text-warning"></i>Login
      </h3>
      {% if form.errors %}
        <div class="alert alert-danger py-2">Invalid username or password.</div>
      {% endif %}
      <form method="post" novalidate>
        {% csrf_token %}
        {{ form|crispy }}
        <div class="d-grid mt-3">
          <button type="submit" class="btn btn-warning fw-semibold">Sign In</button>
        </div>
      </form>
      <div class="text-center mt-3 small">
        <span class="text-muted">Don't have an account?</span>
        <a href="{% url 'catalog:register' %}" class="text-warning text-decoration-none fw-semibold ms-1">Register here</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
