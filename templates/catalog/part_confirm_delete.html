{% extends "base.html" %}

{% block title %}Delete Part - CarPart Hub{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm border-danger p-4">
      <h3 class="fw-bold text-danger mb-3">
        <i class="bi bi-exclamation-triangle me-2"></i>Delete Part
      </h3>
      <p>Are you sure you want to delete spare part <strong>"{{ object.name }}" ({{ object.part_number }})</strong>?</p>
      <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-danger">Yes, delete</button>
          <a href="{% url 'catalog:part-list' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
